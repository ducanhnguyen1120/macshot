name: Build DMG (ad-hoc signed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-26        # Xcode 26 + macOS 26 SDK (NSGlassEffectView / Liquid Glass)
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need tags for git describe

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Set version
        run: |
          RAW=$(git describe --tags --always 2>/dev/null || echo "0.0.0")
          # v4.2.2-beta.3-4-gd47af83 -> 4.2.2-beta.3
          VERSION=$(echo "${RAW#v}" | sed -E 's/-[0-9]+-g[0-9a-f]+$//')
          [ -z "$VERSION" ] && VERSION="0.0.0"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Version $VERSION ($BUILD_NUMBER)"

      - name: Resolve packages
        run: |
          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            -resolvePackageDependencies

      - name: Build
        run: |
          xcodebuild \
            -project macshot.xcodeproj \
            -scheme macshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Ad-hoc sign app and frameworks
        run: |
          APP="build/Build/Products/Release/macshot.app"
          # Sign embedded frameworks first, then the main bundle
          find "$APP/Contents/Frameworks" -name "*.framework" -o -name "*.dylib" 2>/dev/null | while read f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          codesign --force --deep --sign - "$APP"
          echo "Code signature:"
          codesign -dv "$APP" 2>&1 | head -10

      - name: Create DMG
        run: |
          APP="build/Build/Products/Release/macshot.app"
          mkdir -p /tmp/dmg-staging
          cp -R "$APP" /tmp/dmg-staging/
          hdiutil create \
            -volname "DAN.RIDE" \
            -srcfolder /tmp/dmg-staging \
            -ov -format UDZO \
            DAN.RIDE.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAN.RIDE-dmg
          path: DAN.RIDE.dmg
          retention-days: 30
